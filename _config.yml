# Site
name: "Data Analyst Portfolio"
title: "Giang Truong Data Analyst Portforlio"
description: "The place that I put all my progression and data related."
logo: 'assets/images/logoblue.png'
favicon: 'assets/images/logoblue.png'
baseurl: ""
google_analytics: 'UA-46278016-1'
disqus: 'demowebsite'
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  Sep:
    name: Giang Truong 
    display_name: Sep
    gravatar: https://en.gravatar.com/emails
    email: hoanggiangg.tr@gmail.com
    web: https://pouringinsights.github.io
    linkedin: https://www.linkedin.com/in/giangtruong2903/
    description: "A curious data analyst who is trying to maximize performance while cutting down time to manage"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, kds-video]
